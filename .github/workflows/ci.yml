name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
      - name: Doctrine kit copy and registers (tic-doctrine)
        run: python doctrine/kit/tic.py kitcheck && python doctrine/kit/tic.py registers doctrine
